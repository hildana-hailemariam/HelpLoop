<section class="form-section">



<div class="form-container profile-container">





<h1>
👤 My Profile
</h1>



<p>
Create your identity and show the community what you can share.
</p>







<div class="profile-avatar">

<img 
src="https://via.placeholder.com/150"
alt="Profile Image">

</div>









<form action="/profile" method="POST">






<label>
Full Name
</label>


<input

type="text"

name="name"

placeholder="Enter your full name"

required

>








<label>
Email
</label>


<input

type="email"

name="email"

placeholder="Enter your email"

required

>









<label>
About Me
</label>


<textarea

name="bio"

placeholder="Tell people about yourself">

</textarea>









<label>
Skills I Can Teach 💡
</label>


<input

type="text"

name="teach"

placeholder="Example: Web Development, Cooking, Design"

>









<label>
Skills I Want To Learn 🎓
</label>


<input

type="text"

name="learn"

placeholder="Example: JavaScript, Languages"

>








<label>
Experience Level
</label>


<select name="level">


<option>
Beginner
</option>


<option>
Intermediate
</option>


<option>
Advanced
</option>


</select>








<label>
Learning Goal
</label>


<input

type="text"

name="goal"

placeholder="What do you want to achieve?"

>









<button class="btn" type="submit">

Save Profile

</button>





</form>







</div>



</section>
