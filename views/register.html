</header>









<section class="form-section">





<div class="form-container">






<h1>

Join HelpLoop 🚀

</h1>





<p>

Create your account and start learning, teaching, and earning credits.

</p>









<form action="/register" method="POST">






<label>

Full Name

</label>




<input

type="text"

name="name"

placeholder="Enter your full name"

required

>









<label>

Email

</label>




<input

type="email"

name="email"

placeholder="Enter your email"

required

>









<label>

Username

</label>




<input

type="text"

name="username"

placeholder="Create username"

required

>









<label>

Password

</label>




<input

type="password"

name="password"

placeholder="Create password"

required

>









<label>

Main Skill

</label>




<input

type="text"

name="skill"

placeholder="Example: Programming, Cooking, Design"

required

>









<label>

I want to

</label>




<select name="role">


<option value="learn">

Learn new skills

</option>



<option value="teach">

Teach my skills

</option>




<option value="both">

Learn and Teach

</option>



</select>









<button class="btn" type="submit">


Create Account


</button>








</form>









<p class="form-link">


Already have an account?


<a href="login.html">

Login here

</a>



</p>








</div>
